name: QA # GitHub Actions workflow name

# Workflow triggers
on:
  push:
    branches:
      - main # Runs workflow when changes are pushed to main branch
  pull_request:
    branches:
      - main # Runs workflow when Pull Request is created or updated against main branch
  workflow_dispatch: # Allows manual workflow execution from GitHub UI


# Controls concurrent workflow executions
concurrency:
  # Only one workflow runs for the same PR or branch.
  # A new run cancels the previous unfinished run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


# Global workflow environment variables
env:
  APP_URL: http://localhost:81/ui/#/ # Test application URL
  # the admin account of the Keycloak the application uses (KC_BOOTSTRAP_ADMIN_* in docker-compose-test.yml): application.Samples.Feature.signInAgain creates its own users with it
  KEYCLOAK_ADMIN_USER: cxbox_admin
  KEYCLOAK_ADMIN_PASSWORD: ASfj123214LASJhFLASldkasF3LhDGASF
  # CXBOX_LOGGER is off here on purpose. It turns the Selenide proxy on (BaseTestForSamples), and the browser then reaches
  # the application through a tunnel: the "Copy details" test reads CONNECT instead of GET, and the websocket test no longer
  # sees its handshake in the performance log. Both failed with it on, while the 843 ordinary tests passed. Turn it on in
  # the manual run (build_button_qa.yml, "Logging network") when the requests of a test are needed.


jobs:

  build-qa-pr-and-check-autotests:
    # Run this job only for Pull Requests.
    # It will not run for pushes to main or manual workflow execution.
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Continue running remaining matrix jobs if one of them fails

      matrix:
        # Run tests twice:
        # once with Java 17 and once with Java 21
        java: [ '17','21' ]

    # Job names:
    # QA tests Java 17 + slow
    # QA tests Java 21
    # The slow tests run on one java version only, and the name says which one
    # The name is what branch protection requires as a check, so it stays exactly as it is.
    # That the slow tests run in the Java 17 job is said in the pull request comment instead.
    name: QA tests Java ${{ matrix.java }}

    env:
      # Unique docker compose project name.
      # Prevents Docker containers from Java 17 and Java 21 jobs from conflicting.
      COMPOSE_PROJECT_NAME: pr_${{ github.run_id }}_${{ matrix.java }}


    steps:

      # =========================
      # BASE SETUP
      # =========================

      # Clones repository source code into the GitHub runner
      - name: Checkout source code
        uses: actions/checkout@v4


      # Installs required Java version.
      # Enables Maven dependency caching to speed up builds.
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      # Installs Node.js required for frontend build.
      # Enables Yarn dependency caching.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: ui/yarn.lock

      # =========================
      # BUILD BACKEND + FRONTEND
      # =========================

      # Builds backend with Maven.
      # Builds frontend using Maven UI profile.
      # -U forces update of snapshot dependencies.
      - name: Build backend + UI
        run: mvn clean install -U -PUI



      # =========================
      # START TEST ENVIRONMENT
      # =========================

      - name: Start isolated docker environment
        run: |
          docker compose -f docker-compose-test.yml up -d
          # Starts isolated Docker test environment:
          # database, backend, frontend, and other required services.
          #
          # -d runs containers in detached mode.


      # =========================
      # RUN AUTOTESTS
      # =========================

      # Runs Maven automated tests.
      #
      # runTests=true:
      # enables test execution profile.
      #
      # surefire.parallel=classes:
      # runs test classes in parallel.
      #
      # forkCount=3:
      # creates 3 separate JVM processes for tests.
      #
      # threadCount=1:
      # uses one thread inside each JVM process.
      #
      # continue-on-error:
      # allows workflow execution to continue if tests fail.
      # The slow tests (@Tag("Slow")) wait out the lifetime of an access token, about ten minutes in total. In one run they
      # hold a fork and its browser all that time: the queue of the other classes waits, and the neighbours of that fork
      # meet a frozen tab. They run as a second surefire process instead, in its own fork with its own browser, at the
      # same time as the rest; the results of both go into one allure report.
      # Their subject is the browser, the OIDC provider and the ui, not the jvm, so one java version is enough for them:
      # they run in the Java 17 job only, which its name says. Fifteen minutes of waiting are not spent twice, and the
      # Java 21 job keeps three browsers instead of four.
      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          set +e
          TESTS=application.Samples.Form.**,application.Samples.Info.**,application.Samples.List.**,application.Samples.Tree.**,application.Samples.Popup.**,application.Samples.StatsBlock.**,application.Samples.BugFixTests,application.Samples.DictionaryAdministrationTest,application.Samples.Feature.**
          mvn --batch-mode -DrunTests=true test-compile > target/test-compile.log 2>&1
          COMPILE_CODE=$?
          if [ $COMPILE_CODE -ne 0 ]; then cat target/test-compile.log; exit $COMPILE_CODE; fi
          # the slow process brings a fourth browser to the two cores of the runner: the fast process gives one of its forks
          # back where they run together, so the runner keeps three browsers either way
          FAST_FORKS=3
          if [ "${{ matrix.java }}" = "17" ]; then FAST_FORKS=2; fi
          mvn --batch-mode -DrunTests=true -Dtest="$TESTS" -Dsurefire.forkCount=$FAST_FORKS surefire:test@fast > target/tests-fast.log 2>&1 &
          FAST_PID=$!
          SLOW_CODE=0
          SLOW_PID=""
          if [ "${{ matrix.java }}" = "17" ]; then
            mvn --batch-mode -DrunTests=true -Dtest="$TESTS" surefire:test@slow > target/tests-slow.log 2>&1 &
            SLOW_PID=$!
          fi
          wait $FAST_PID; FAST_CODE=$?
          if [ -n "$SLOW_PID" ]; then wait $SLOW_PID; SLOW_CODE=$?; fi
          echo "::group::Tests without the slow ones"; cat target/tests-fast.log; echo "::endgroup::"
          if [ -n "$SLOW_PID" ]; then echo "::group::Slow tests"; cat target/tests-slow.log; echo "::endgroup::"; fi
          mkdir -p target/allure-results
          cp -r target/allure-results-fast/. target/allure-results/ 2>/dev/null || true
          cp -r target/allure-results-slow/. target/allure-results/ 2>/dev/null || true
          echo "exit codes: fast=$FAST_CODE slow=$SLOW_CODE"
          [ $FAST_CODE -eq 0 ] && [ $SLOW_CODE -eq 0 ]


        # A screenshot shows what the browser saw, and when several browsers sign in at once that is sometimes the error page
        # of the OIDC provider ("An error occurred, please login again through your application"). Why it was shown is in the
        # log of the provider itself: an expired code (accessCodeLifespan is 60 seconds), a lost authentication session.
        # The step runs always on purpose: a rerun that passes keeps the job green, and those are the failures worth reading.
        # The timestamps are what lines the log up with the moment a test failed.
      - name: Keycloak log
        if: always()
        run: |
          docker compose -f docker-compose-test.yml logs --no-color --timestamps cxbox-code-samples-keycloak > keycloak-${{ matrix.java }}.log 2>&1 || true
          echo "::group::Keycloak: warnings, errors and the login flow"
          grep -inE "warn|error|expired|invalid|authentication session" keycloak-${{ matrix.java }}.log | tail -100 || true
          echo "::endgroup::"

      - name: Upload Keycloak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-log-${{ matrix.java }}
          path: keycloak-${{ matrix.java }}.log

        # Saves test execution result:
        # success / failure / cancelled
        # into a separate file for each Java version.
      - name: Save test result
        if: always()
        run: |
          echo "${{ steps.run_tests.outcome }}" > test-result-${{ matrix.java }}.txt

      # Uploads test result as workflow artifact.
      # It will be downloaded later by publish-summary job.
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.java }}
          path: test-result-${{ matrix.java }}.txt

      # =========================
      # ALLURE REPORT
      # =========================

      # create /home/runner/work/cxbox-code-samples/cxbox-code-samples/gh-pages
      # git clone gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          repository: CX-Box/cxbox-code-samples-allure
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          fetch-depth: 1
        # ├── gh-pages/
        # │   └── pull_request/
        # │     └── 125/
        # │         ├── java-17/
         #│         │   ├── index.html
         #│         │   ├── data/
         #│         │   └── history/
         #│         │       ├── history.json
         #│         │       ├── trend.json
         #│         │       └── retries-trend.json
         #│         │
         #│         └── java-21/
         #│            ├── index.html
         #│            └── history/

        # trend visual file ->/history/history-trend.json
      - name: Copy trend history
        if: always()
        run: |
          mkdir -p allure-report/${{ github.event.pull_request.number }}/java-${{ matrix.java }}/history
          
          cp -r gh-pages/pull_request/${{ github.event.pull_request.number }}/java-${{ matrix.java }}/history/* \
                allure-report/${{ github.event.pull_request.number }}/java-${{ matrix.java }}/history/ || true
        # workspace
        # allure-report/
        # └── 125/                         # Pull Request number
        #     └── java-17/                  # Java version used for test execution
        #         └── history/              # Previous Allure history data
        #             ├── history.json      # Test execution history (previous runs)
        #             ├── trend.json        # Trend data for Allure Trend widget
        #             └── retries-trend.json # Retry statistics history

      # Generates a new Allure report based on test results.
      # Also loads previous history from gh-pages
      # to preserve trends and statistics between workflow runs.
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        id: allure-report
        with:
          allure_results: target/allure-results
          # Directory containing old test results  - all pr
          gh_pages: gh-pages/pull_request/${{ github.event.pull_request.number }}/java-${{ matrix.java }}
          allure_report: allure-report/${{ github.event.pull_request.number }}/java-${{ matrix.java }}
          allure_history: allure-history/${{ github.event.pull_request.number }}/java-${{ matrix.java }}
          github_repo: CX-Box/cxbox-code-samples-allure
          github_repo_owner: CX-Box
          report_url: https://cx-box.github.io/cxbox-code-samples-allure/pull_request/${{ github.event.pull_request.number }}/java-${{ matrix.java }}
          # How many last Allure runs should be stored inside the `history` of a single report.
          keep_reports: 5

        # workspace
        # ├── allure-history/
        # │   └── java-${{ matrix.java }}/
        # │       └── history/
        # │           ├── history.json
        # │           ├── trend.json
        # │           └── retries-trend.json
        # │
        # └── allure-report/
        #     └── ${{ github.event.pull_request.number }}/
        #         └── java-${{ matrix.java }}/
        #             ├── index.html
        #             ├── data/
        #             ├── widgets/
        #             └── history/
        #                 ├── history.json
        #                 ├── trend.json
        #                 └── retries-trend.json

        # Uploads generated Allure report as workflow artifact.
      # To prevent reports from different Java matrix jobs from overwriting each other,
      # the artifact name is made unique by adding the Java version:
      # allure-report -> allure-report-${{ matrix.java }}
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.java }}
          path: allure-report
        # GitHub Actions Artifact Storage:
        #
        # allure-report-17
        # └── allure-report/
        #     └── 125/
        #         └── java-17/
        #             ├── index.html
        #             └── history/
        #
        #
        # allure-report-21
        # └── allure-report/
        #     └── 125/
        #         └── java-21/
        #             ├── index.html
        #             └── history/
        #

      # =========================
      # CLEANUP
      # =========================

      - name: Clean up containers
        if: always()
        run: |

          echo "Stopping containers for $COMPOSE_PROJECT_NAME..."

          docker compose -f docker-compose-test.yml down --remove-orphans

          # Stops Docker Compose containers.


          docker container prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"

          # Removes remaining containers from current compose project.


          docker network prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"

          # Removes Docker networks created for current compose project.


  # =========================
  # PUBLISH SUMMARY
  # =========================

  publish-summary:

    name: Publish Report Links

    runs-on: ubuntu-latest

    needs: [ build-qa-pr-and-check-autotests ]
    # Runs after both matrix jobs:
    # Java 17 and Java 21.


    if: always() &&
      github.event_name == 'pull_request'
    # Runs even if previous jobs failed.


    steps:

      # Downloads Allure reports uploaded by matrix jobs.
      # The reports are restored into the allure-report directory,
      # which will be published to GitHub Pages.
      - name: Download Allure reports
        uses: actions/download-artifact@v4
        with:
          pattern: allure-report-*
          path: allure-report
          # merge-multiple- Merges downloaded artifact contents into a single directory.
          merge-multiple: true
        # workspace after download-artifact
        #
        # /home/runner/work/cxbox-code-samples/cxbox-code-samples
        #
        # └── allure-report/
        #     └── 125/
        #         ├── java-17/
        #         │   ├── index.html
        #         │   ├── data/
        #         │   └── history/
        #         │       ├── history.json
        #         │       ├── trend.json
        #         │       └── retries-trend.json
        #         │
        #         └── java-21/
        #             ├── index.html
        #             └── history/
        #


      # Downloads test results from Java 17 and Java 21 jobs
      # Required for the Prepare PR comment step.
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: test-result-*
          merge-multiple: true
      - name: Prepare PR comment
        id: comment
        run: |
          
          JAVA17=$(cat test-result-17.txt)
          JAVA21=$(cat test-result-21.txt)
          
          # Reads Java 17 test execution result.
          
          if [ "$JAVA17" = "success" ]; then
            echo "java17=☕ Java 17 + slow ✅ Passed" >> $GITHUB_OUTPUT
          elif [ "$JAVA17" = "failure" ]; then
             echo "java17=☕ Java 17 + slow ❌ Failed" >> $GITHUB_OUTPUT
          else
            echo "java17=☕ Java 17 + slow ⚪ Cancelled" >> $GITHUB_OUTPUT
          fi
          
          
          # Reads Java 21 test execution result.
          
          if [ "$JAVA21" = "success" ]; then
            echo "java21=☕ Java 21 ✅ Passed" >> $GITHUB_OUTPUT
          elif [ "$JAVA21" = "failure" ]; then
            echo "java21=☕ Java 21 ❌ Failed" >> $GITHUB_OUTPUT
          else
            echo "java21=☕ Java 21 ⚪ Cancelled" >> $GITHUB_OUTPUT
          fi

      # Publishes Allure reports to separate GitHub Pages repository.
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          external_repository: CX-Box/cxbox-code-samples-allure
          personal_token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: pull_request
          keep_files: true
          # with keep_files: true = gh-pages
          #└── pull_request
          #    ├── 125
          #    ├── 126
          #    └── 127
          #with keep_files: false  = gh-pages
          #└── pull_request
          #    └── 127
          force_orphan: false #delete history commit in gh-pages

        # external repository after publish:
        #
        # CX-Box/cxbox-code-samples-allure
        # branch: gh-pages
        #
        # gh-pages/
        # └── pull_request/
        #     └── 125/
        #         ├── java-17/
        #         │   ├── index.html
        #         │   └── history/
        #         │       ├── trend.json
        #         │       └── history.json
        #         │
        #         └── java-21/
        #             ├── index.html
        #             └── history/
        #


      # Adds Pull Request comment containing:
      # - Java 17 test status
      # - Java 17 Allure report link
      # - Java 21 test status
      # - Java 21 Allure report link
      - name: Comment on Pull Request
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          issue-number: ${{ github.event.pull_request.number }}

          body: |

            ### QA autotests result

            ${{ steps.comment.outputs.java17 }}
            
            
            [Allure Report](https://cx-box.github.io/cxbox-code-samples-allure/pull_request/${{ github.event.pull_request.number }}/java-17/)

            ${{ steps.comment.outputs.java21 }}
            
            [Allure Report]( https://cx-box.github.io/cxbox-code-samples-allure/pull_request/${{ github.event.pull_request.number }}/java-21/)

  build-qa-main-and-check-autotests:
    # Run workflow only after push to main branch.
    # Does not run for Pull Requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false

      matrix:
        # Run tests with both Java versions.
        java: ['17', '21']


    name: QA main tests Java ${{ matrix.java }}


    env:
      # Unique Docker Compose project name.
      # Prevents Java 17 and Java 21 containers from conflicting.
      COMPOSE_PROJECT_NAME: main_${{ github.run_id }}_${{ matrix.java }}


    steps:

      # =========================
      # BASE SETUP
      # =========================

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: ui/yarn.lock


      # =========================
      # BUILD BACKEND + FRONTEND
      # =========================

      - name: Build backend + UI
        run: mvn clean install -U -PUI



      # =========================
      # START DOCKER
      # =========================

      - name: Start isolated docker environment
        run: |
          docker compose -f docker-compose-test.yml up -d



      # =========================
      # RUN TESTS
      # =========================

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          mvn --batch-mode \
            -DrunTests=true \
            -Dsurefire.parallel=classes \
            -Dsurefire.forkCount=3 \
            -Dsurefire.threadCount=1 \
            -Dsurefire.reuseForks=true \
            -Dtest=application.Samples.Form.**,application.Samples.Info.**,application.Samples.List.**,application.Samples.Tree.**,application.Samples.Popup.**,application.Samples.StatsBlock.**,application.Samples.BugFixTests,application.Samples.DictionaryAdministrationTest,application.Samples.Feature.** \
            test



      # =========================
      # ALLURE REPORT
      # =========================


      # Downloads previous main branch Allure history.
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          repository: CX-Box/cxbox-code-samples-allure
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          fetch-depth: 1



      # Generates Allure report for main branch.
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        id: allure-report
        with:

          allure_results: target/allure-results
          # Existing history location for main branch.
          gh_pages: gh-pages/main
          # Generated report location.
          allure_report: allure-report/java-${{ matrix.java }}
          # Allure history storage.
          allure_history: allure-history/java-${{ matrix.java }}
          github_repo: CX-Box/cxbox-code-samples-allure
          github_repo_owner: CX-Box
          report_url: https://cx-box.github.io/cxbox-code-samples-allure/main/java-${{ matrix.java }}
          # Keep last 5 runs inside history.
          keep_reports: 5



      # Upload report for publish job.
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-main-report-${{ matrix.java }}
          path: allure-report



      # =========================
      # CLEANUP
      # =========================

      - name: Clean up containers
        if: always()
        run: |

          echo "Stopping containers for $COMPOSE_PROJECT_NAME..."

          docker compose -f docker-compose-test.yml down --remove-orphans


          docker container prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"


          docker network prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"

  publish-main-report:

    name: Publish Main Allure Report

    runs-on: ubuntu-latest

    needs:
      - build-qa-main-and-check-autotests

    if: always() &&
      github.event_name == 'push'


    steps:

      - name: Download Allure reports
        uses: actions/download-artifact@v4
        with:
          pattern: allure-main-report-*
          path: allure-report
          merge-multiple: true

      - name: Publish main Allure report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          external_repository: CX-Box/cxbox-code-samples-allure
          personal_token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: main
          keep_files: true
          force_orphan: false

      - name: Generate and add report URL to Job Summary
        if: always()
        run: |
          echo "### Allure Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Java 17: https://cx-box.github.io/cxbox-code-samples-allure/main/java-17/" >> $GITHUB_STEP_SUMMARY
          echo "Java 21: https://cx-box.github.io/cxbox-code-samples-allure/main/java-21/" >> $GITHUB_STEP_SUMMARY
