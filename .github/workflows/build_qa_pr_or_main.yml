name: QA # Название GitHub Actions workflow

# Триггеры запуска workflow
on:
  push:
    branches:
      - main # Запуск при push в main
  pull_request:
    branches:
      - main # Запуск при создании/обновлении Pull Request в main
  workflow_dispatch: # Возможность ручного запуска workflow из GitHub UI


# Управление параллельными запусками
concurrency:
  # Для одного PR или ветки запускается только один workflow.
  # Новый запуск отменяет предыдущий незавершенный запуск.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


# Общие переменные окружения workflow
env:
  APP_URL: http://localhost:81/ui/#/ # URL тестового приложения


jobs:

  build-qa-pr-and-check-autotests:
    # Запускаем job только для Pull Request.
    # Push в main и ручной запуск эту job не выполнят.
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Если один вариант matrix упал, остальные продолжают выполняться

      matrix:
        # Запускаем тесты два раза:
        # один раз на Java 17 и один раз на Java 21
        java: ['17','21']

    # Имя job будет:
    # QA tests Java 17
    # QA tests Java 21
    name: QA tests Java ${{ matrix.java }}

    env:
      # Уникальное имя docker compose проекта.
      # Нужно, чтобы контейнеры Java 17 и Java 21 не конфликтовали между собой.
      COMPOSE_PROJECT_NAME: pr_${{ github.run_id }}_${{ matrix.java }}


    steps:

      # =========================
      # BASE SETUP
      # =========================

      - name: Checkout source code
        uses: actions/checkout@v4
        # Клонирует код репозитория в runner


      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
        # Устанавливает нужную версию Java.
        # Включает Maven cache для ускорения следующих сборок.


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: ui/yarn.lock
        # Устанавливает Node.js для сборки frontend.
        # Кэширует зависимости Yarn.


      # =========================
      # BUILD BACKEND + FRONTEND
      # =========================

      - name: Build backend + UI
        run: mvn clean install -U -PUI
        # Собирает backend Maven.
        # Собирает frontend через Maven UI profile.
        # -U обновляет snapshot зависимости.


      # =========================
      # START TEST ENVIRONMENT
      # =========================

      - name: Start isolated docker environment
        run: |
          docker compose -f docker-compose-test.yml up -d
          # Поднимает тестовое окружение в Docker:
          # database, backend, frontend и другие сервисы.
          #
          # -d запускает контейнеры в фоне.


      # =========================
      # RUN AUTOTESTS
      # =========================

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        run: |
          mvn --batch-mode \
            -DrunTests=true \
            -Dsurefire.parallel=classes \
            -Dsurefire.forkCount=3 \
            -Dsurefire.threadCount=1 \
            -Dsurefire.reuseForks=true \
            -Dtest=application.Samples.BugFixTests \
            test

        # Запускает автотесты Maven.
        #
        # runTests=true:
        # включает запуск тестового профиля.
        #
        # surefire.parallel=classes:
        # параллельный запуск тестовых классов.
        #
        # forkCount=3:
        # создаёт 3 JVM процесса для тестов.
        #
        # threadCount=1:
        # внутри каждого процесса один поток.
        #
        # continue-on-error:
        # workflow продолжает выполнение даже если тесты упали.


      - name: Save test result
        if: always()
        run: |
          echo "${{ steps.run_tests.outcome }}" > test-result-${{ matrix.java }}.txt

        # Сохраняет результат тестов:
        # success / failure / cancelled
        # в отдельный файл для Java версии.


      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.java }}
          path: test-result-${{ matrix.java }}.txt

        # Загружает результат тестов как artifact.
        # Потом job publish-summary сможет его скачать.


      # =========================
      # ALLURE HISTORY
      # =========================

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          repository: CX-Box/cxbox-code-samples-allure
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.CODE_SAMPLES_ALLURE }}

        # Забирает предыдущие Allure отчёты из отдельного репозитория.
        # Нужно для сохранения истории тестов.

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: target/allure-results
          # Папка с результатами тестов

          gh_pages: gh-pages/pull_request/java-${{ matrix.java }}
          # Куда сохранять историю отчётов

          allure_report: allure-report/java-${{ matrix.java }}
          # Путь для нового отчёта

          allure_history: allure-history/java-${{ matrix.java }}
          # Путь для истории Allure

          github_repo: CX-Box/cxbox-code-samples-allure
          github_repo_owner: CX-Box

          report_url: https://cx-box.github.io/cxbox-code-samples-allure/pull_request/java-${{ matrix.java }}

          keep_reports: 40
          # Хранить последние 40 отчётов

      - name: Prepare reports for publishing
        if: always()
        run: |
          mkdir -p publish/java-${{ matrix.java }}
          cp -r allure-report/java-${{ matrix.java }}/. publish/java-${{ matrix.java }}/
        # Собрать отчёты в одну папку

      # =========================
      # CLEANUP
      # =========================

      - name: Clean up containers
        if: always()
        run: |

          echo "Stopping containers for $COMPOSE_PROJECT_NAME..."

          docker compose -f docker-compose-test.yml down --remove-orphans

          # Останавливает контейнеры docker compose.


          docker container prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"

          # Удаляет оставшиеся контейнеры текущего compose проекта.


          docker network prune -f \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"

          # Удаляет docker networks текущего запуска.


  # =========================
  # PUBLISH SUMMARY
  # =========================

  publish-summary:

    name: Publish Report Links

    runs-on: ubuntu-latest

    needs: [build-qa-pr-and-check-autotests]
    # Запускается после завершения обеих matrix job:
    # Java 17 и Java 21.


    if: always()
    # Выполняется даже если тесты упали.


    steps:

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: test-result-*
          merge-multiple: true

        # Загружает результаты тестов Java 17 и Java 21.


      - name: Prepare PR comment
        id: comment
        run: |

          JAVA17=$(cat test-result-17.txt)
          JAVA21=$(cat test-result-21.txt)

          # Читает результаты тестов.


          if [ "$JAVA17" = "success" ]; then
            echo "java17=☕ Java 17 ✅ Passed" >> $GITHUB_OUTPUT
          else
            echo "java17=☕ Java 17 ❌ Failed" >> $GITHUB_OUTPUT
          fi

          # Формирует статус Java 17.


          if [ "$JAVA21" = "success" ]; then
            echo "java21=☕ Java 21 ✅ Passed" >> $GITHUB_OUTPUT
          else
            echo "java21=☕ Java 21 ❌ Failed" >> $GITHUB_OUTPUT
          fi

          # Формирует статус Java 21.


      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          external_repository: CX-Box/cxbox-code-samples-allure
          personal_token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: pull_request
          keep_files: false

        # Публикует Allure отчёты в отдельный GitHub Pages репозиторий.


      - name: Comment on Pull Request
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.CODE_SAMPLES_ALLURE }}
          issue-number: ${{ github.event.pull_request.number }}

          body: |

            ### QA autotests result

            ${{ steps.comment.outputs.java17 }}

            https://cx-box.github.io/cxbox-code-samples-allure/pull_request/java-17/${{ github.run_number }}

            ${{ steps.comment.outputs.java21 }}

            https://cx-box.github.io/cxbox-code-samples-allure/pull_request/java-21/${{ github.run_number }}


        # Добавляет комментарий в Pull Request:
        # - статус Java 17
        # - ссылку на Allure Java 17
        # - статус Java 21
        # - ссылку на Allure Java 21