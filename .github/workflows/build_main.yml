name: Build project main

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# All runs deploy to the same server (/home/cxbox/code-samples). Two pushes to main close together started two
# deploys at once: the second one removed the containers and the folder of the first one during its
# `docker compose up --wait`, and both 'start' steps hung until the 10 min timeout.
# Only one run at a time; a newer push waits for the running one and replaces the older pending one.
concurrency:
  group: build-main-and-deploy
  cancel-in-progress: false

jobs:
  build-main-and-deploy:
    env:
      APP_URL: https://code-samples.cxbox.org/ui/#/
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17','21']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: "maven"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock
      - name: Build with Maven
        run: mvn clean install -U -PUI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: matrix.java == '17'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Build
        if: matrix.java == '17'
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        if: matrix.java == '17'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cxbox-code-samples:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cxbox-code-samples:${{ github.sha }}
      - name: prepare - stop all containers from previous deploy
        if: matrix.java == '17'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 188.124.37.74
          username: ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          script: |
            sudo mkdir /home/cxbox/code-samples || true
            sudo chmod -R 777 /home/cxbox/code-samples || true
            cd /home/cxbox/code-samples
            sudo docker ps
            sudo docker compose -f docker-compose-prod.yml rm -svfa || true
            sudo docker system prune --force
            sudo docker volume prune --force
            sudo docker image prune -a --force
            sudo docker ps
      - name: prepare - copy files from new release and delete old files
        if: matrix.java == '17'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 188.124.37.74
          username:  ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          source: "docker,docker-compose-prod.yml"
          target: /home/cxbox/code-samples
          rm: true
      - name: start
        if: matrix.java == '17'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 188.124.37.74
          username: ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          script: |
            sudo chmod -R 777 /home/cxbox/code-samples || true
            cd /home/cxbox/code-samples
            sudo CODE_SAMPLES_TAG=${{ github.sha }} docker compose -f docker-compose-prod.yml up -d --wait -t 60
            sudo docker image inspect cxbox/cxbox-code-samples:${{ github.sha }} --format 'deployed image {{.Id}} created {{.Created}}'
            docker ps

  # --- Telegram notifications (secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) ---
  # main: message when the deploy starts and when it finishes (success / failure; a cancelled run sends nothing). Other branches: message only if something failed.
  notify-start:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/telegram-notify.yml
    secrets: inherit
    with:
      status: started

  notify-result:
    needs: [build-main-and-deploy]
    if: always() && (contains(needs.*.result, 'failure') || (github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled')))
    uses: ./.github/workflows/telegram-notify.yml
    secrets: inherit
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'success') && 'success' || 'skipped' }}
